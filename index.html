<html lang="en">
<head>

<title>Recall: exam-ready, on schedule</title>
<style>
  :root{
    --bg:#F3F6F4; --surface:#FFFFFF; --ink:#0B1B14; --muted:#41544A; --line:#C5D1CA;
    --brand:#0B5D36; --brand-ink:#FFFFFF; --dark:#0A2418; --mint:#9BF0C0; --warn:#B42318;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  body.src{
    --bg:#0C1330; --surface:#151F47; --ink:#F5F7FF; --muted:#C3CBEB; --line:#3A4880;
    --brand:#FFC857; --brand-ink:#0C1330; --dark:#0C1330; --warn:#FF9C92;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;transition:background .3s,color .3s}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 18px calc(100px + env(safe-area-inset-bottom))}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  body.src :focus-visible{outline-color:#fff}

  header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 8px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:38px;height:38px;flex:none}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .tag{font-size:13px;color:var(--muted);margin-top:3px}
  .streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800}

  .btn{min-height:52px;border-radius:14px;border:2px solid transparent;padding:12px 18px;font-weight:800;width:100%;background:var(--brand);color:var(--brand-ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.small{min-height:46px;width:auto}
  .btn.danger{background:transparent;color:var(--warn);border-color:var(--warn)}
  .card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
  .row{display:flex;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .stat b{display:block;font-size:30px;line-height:1.1;font-family:var(--serif)}
  .stat span{font-size:14px;color:var(--muted)}
  .muted{color:var(--muted)}
  h2.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-weight:700}

  .hero{background:radial-gradient(120% 120% at 100% 0%,#14432E 0%,var(--dark) 60%);color:#fff;border-radius:26px;padding:22px;margin-top:10px}
  .hero .top{display:flex;gap:18px;align-items:center}
  .ring{width:112px;height:112px;flex:none}
  .hero .lbl{color:#B7E8CB;font-size:14px;font-weight:600}
  .hero .ttl{font-size:20px;font-weight:800;line-height:1.2;margin:2px 0}
  .hero .big{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1}
  .hero .btn{background:var(--mint);color:#04140C;margin-top:18px}
  .hero .btn:disabled{background:#2F4A3D;color:#D5E5DB;opacity:1}
  .plan{display:flex;gap:8px;margin-top:16px}
  .plan div{flex:1;background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px}
  .plan b{display:block;font-size:20px;font-family:var(--serif)}
  .plan span{font-size:12px;color:#B7E8CB}

  .bars{display:flex;gap:8px;align-items:flex-end;height:84px;margin-top:8px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
  .bar i{display:block;width:100%;border-radius:6px;background:var(--line)}
  .bar.t i{background:var(--brand)}
  .bar span{font-size:12px;color:var(--muted);font-weight:700}

  .flash{background:var(--surface);border:2px solid var(--line);border-radius:26px;min-height:290px;padding:26px;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:flip .3s ease}
  .flash .side{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .flash .txt{font-family:var(--serif);font-size:24px;line-height:1.35}
  .flash .cite{margin-top:16px;font-size:13px;color:var(--muted)}
  @keyframes flip{from{transform:rotateX(60deg);opacity:0}to{transform:none;opacity:1}}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .g{border-radius:14px;padding:10px 4px;text-align:center;border:2px solid;font-weight:800;min-height:64px}
  .g small{display:block;font-weight:600;font-size:12px;margin-top:2px}
  .g0{background:#FDE3E0;color:#6E0F08;border-color:#B42318}
  .g1{background:#FFEBC2;color:#5A3300;border-color:#B26A00}
  .g2{background:#CDEFD9;color:#083F24;border-color:#0B5D36}
  .g3{background:#0B5D36;color:#fff;border-color:#0B5D36}
  .progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 12px}
  .progress i{display:block;height:100%;background:var(--brand)}

  input.f,textarea.f{width:100%;background:transparent;border:0;border-bottom:2px solid var(--line);padding:12px 2px;outline:none;font-size:16px}
  textarea.f{resize:none}
  .box{border:2px solid var(--line)!important;border-radius:12px;padding:12px!important;margin-top:8px}
  .seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px;margin-top:10px}
  .seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted);min-height:44px}
  .seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
  .item{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
  .item .q{font-weight:700}
  .item .a{font-size:14px;color:var(--muted);margin-top:2px}
  .chipsrc{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);border:1.5px solid var(--brand);border-radius:6px;padding:1px 7px;margin:6px 6px 0 0}
  .chipst{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
  .icon-btn{background:none;border:0;padding:10px;margin:-6px -6px 0 0;color:var(--warn)}
  .draft input{width:24px;height:24px;margin-top:2px;accent-color:var(--brand);flex:none}

  nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav .in{max-width:480px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
  nav button[aria-current="page"]{color:var(--ink);font-weight:800}
  nav button[aria-current="page"] svg{stroke:var(--brand)}
  nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--brand);font-weight:700;margin-top:8px}
  .src-title{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:6px 0 14px}
  .ask{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
  .ask textarea{width:100%;background:transparent;border:0;outline:none;resize:none;font-size:18px;min-height:76px}
  .ask textarea::placeholder{color:var(--muted);opacity:.85}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 4px;margin:0 -18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
  .chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:800}
  .res{display:flex;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
  .num{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--brand);line-height:1}
  .res .nm{font-size:19px;font-weight:800;line-height:1.2}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--brand);color:var(--brand);border-radius:6px;padding:2px 7px;margin:6px 0;font-weight:700}
  .res p{margin:4px 0 12px;font-size:15px;color:var(--muted)}
  .open{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:800;text-decoration:none;width:100%}
  .note{border-left:4px solid var(--brand);padding:8px 12px;margin-top:14px;font-size:14px;color:var(--muted)}
  .hist{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;font-size:15px}

  /* ---------- Lens Insight ---------- */
  body.lens{--bg:#050507;--surface:#0D0D12;--ink:#F5F3FF;--muted:#A7A3B5;--line:#292532;--brand:#9A63FF;--brand-ink:#0A0612;--dark:#050507;--warn:#FF8F9A}
  body.lens #app{max-width:520px}
  .lens-shell{min-height:calc(100vh - 92px);padding:4px 0 24px}
  .lens-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#191126 0%,#09080D 44%,#030304 100%);border:1px solid #2D2638;border-radius:28px;padding:28px 20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  .lens-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:#B88CFF;font-weight:800;text-transform:uppercase}
  .lens-title{font-size:32px;line-height:1.06;letter-spacing:-.03em;font-weight:850;margin:7px 0 8px}
  .lens-sub{color:#B8B2C8;font-size:15px;margin:0;max-width:38ch}
  .lens-orbit{height:210px;position:relative;margin:8px -8px 4px}
  .lens-orbit:before,.lens-orbit:after{content:"";position:absolute;left:50%;top:50%;border:1px solid rgba(154,99,255,.18);border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg);width:180px;height:74px}
  .lens-orbit:after{width:240px;height:100px;transform:translate(-50%,-50%) rotate(22deg);border-color:rgba(255,255,255,.07)}
  .lens-hole{position:absolute;left:50%;top:56%;width:92px;height:92px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 48%,#000 0 35%,#140D20 48%,#5A2BB1 60%,transparent 70%);box-shadow:0 0 55px rgba(154,99,255,.28)}
  .lens-astronaut{position:absolute;left:50%;top:42%;font-size:54px;transform:translate(-50%,-50%) rotate(-24deg);filter:drop-shadow(0 10px 20px rgba(154,99,255,.3));animation:lensFall 1.9s ease-in-out infinite}
  @keyframes lensFall{0%{top:17%;transform:translate(-50%,-50%) rotate(-18deg) scale(1)}55%{top:43%;transform:translate(-50%,-50%) rotate(-32deg) scale(.9)}100%{top:67%;transform:translate(-50%,-50%) rotate(-48deg) scale(.65);opacity:.28}}
  .lens-loading{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;color:#D7CCEA;font-weight:700;font-size:14px}
  .lens-dots{display:inline-flex;gap:4px}.lens-dots i{width:5px;height:5px;border-radius:50%;background:#A874FF;animation:lensDot 1s infinite}.lens-dots i:nth-child(2){animation-delay:.16s}.lens-dots i:nth-child(3){animation-delay:.32s}
  @keyframes lensDot{0%,60%,100%{opacity:.25;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
  .lens-panel{background:#09090C;border:1px solid #292532;border-radius:24px;padding:18px;margin-top:14px}
  .lens-panel h3{margin:0 0 5px;font-size:19px}.lens-panel p{margin:0;color:#A7A3B5;font-size:14px}
  .lens-action{width:100%;min-height:64px;border:1px solid #30283D;background:#101016;color:#F5F3FF;border-radius:16px;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-top:10px}
  .lens-action .ico{width:40px;height:40px;border-radius:12px;background:#1C1428;display:grid;place-items:center;font-size:21px;flex:none}.lens-action b{display:block;font-size:15px}.lens-action span{display:block;color:#A7A3B5;font-size:12px;margin-top:2px}.lens-action strong{margin-left:auto;color:#B88CFF;font-size:20px}
  .lens-camera{position:relative;overflow:hidden;border-radius:22px;background:#000;border:1px solid #2C2636;aspect-ratio:3/4;margin-top:12px}.lens-camera video,.lens-camera img{width:100%;height:100%;object-fit:cover;display:block}.lens-camera .guide{position:absolute;inset:12% 10%;border:1.5px solid rgba(184,140,255,.8);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.16);pointer-events:none}.lens-camera .corner{position:absolute;inset:12% 10%;border-radius:18px;pointer-events:none;background:linear-gradient(#B88CFF,#B88CFF) left top/28px 2px no-repeat,linear-gradient(#B88CFF,#B88CFF) left top/2px 28px no-repeat,linear-gradient(#B88CFF,#B88CFF) right top/28px 2px no-repeat,linear-gradient(#B88CFF,#B88CFF) right top/2px 28px no-repeat,linear-gradient(#B88CFF,#B88CFF) left bottom/28px 2px no-repeat,linear-gradient(#B88CFF,#B88CFF) left bottom/2px 28px no-repeat,linear-gradient(#B88CFF,#B88CFF) right bottom/28px 2px no-repeat,linear-gradient(#B88CFF,#B88CFF) right bottom/2px 28px no-repeat}
  .lens-status{font-size:13px;color:#B8B2C8;margin-top:9px}.lens-badge{display:inline-flex;border:1px solid #4A3861;color:#C7A7FF;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
  .lens-preview{width:100%;border-radius:18px;border:1px solid #30283D;display:block;background:#000;margin-top:12px;max-height:360px;object-fit:contain}
  .lens-result{background:linear-gradient(145deg,#100D16,#09090C);border:1px solid #332A40;border-radius:20px;padding:16px;margin-top:12px}.lens-result b{font-size:16px}.lens-result p{color:#AAA4B7;font-size:13px;margin:5px 0 0}
  .lens-local{background:linear-gradient(145deg,#0D0D13,#09090C);border:1px solid #332A40;border-radius:22px;padding:16px;margin-top:12px}
  .lens-local-head{display:flex;align-items:flex-start;gap:10px}.lens-local-head .ico{width:42px;height:42px;border-radius:13px;background:#1A1226;display:grid;place-items:center;font-size:21px;flex:none}.lens-local-head b{font-size:16px}.lens-local-head span{display:block;color:#A7A3B5;font-size:12px;margin-top:2px}
  .lens-chat{margin-top:14px;max-height:430px;overflow:auto;padding-right:2px}.lens-chat-msg{border:1px solid #292532;border-radius:16px;padding:11px 12px;margin-top:9px;font-size:14px;white-space:pre-wrap}.lens-chat-msg.user{background:#171020;border-color:#3B2B4E}.lens-chat-msg.ai{background:#0C0C10}.lens-chat-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#A874FF;font-weight:800;margin-bottom:4px}
  .lens-chat-form{display:flex;gap:8px;margin-top:12px}.lens-chat-input{min-height:48px;flex:1;resize:none;background:#0A0A0D;border:1px solid #39313F;border-radius:14px;padding:11px 12px;outline:none}.lens-chat-input:focus{border-color:#A874FF}.lens-chat-send{min-width:78px;border:0;border-radius:14px;background:#B88CFF;color:#08050D;font-weight:850}.lens-chat-send:disabled{opacity:.45}.lens-starters{display:flex;gap:7px;overflow:auto;margin-top:10px;padding-bottom:2px}.lens-starters button{white-space:nowrap;border:1px solid #3A3048;background:#111016;color:#D9D1E7;border-radius:999px;padding:8px 10px;font-size:12px}.lens-ai-progress{margin-top:10px;color:#CFC4DE;font-size:12px;line-height:1.4}.lens-ai-progress .bar{height:5px;background:#211B2B;border-radius:999px;overflow:hidden;margin-top:6px}.lens-ai-progress .fill{height:100%;background:#A874FF;border-radius:999px;transition:width .2s}
  .lens-mini{font-size:12px;color:#8F899B;margin-top:12px;line-height:1.5}
  .lens-check{margin-top:10px;min-height:44px;border:1px solid #6B4FA0;background:transparent;color:#D9C2FF;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
  .from-lens{background:var(--surface);border:2px solid var(--brand);border-radius:16px;padding:14px;margin-bottom:14px}.from-lens p{margin:6px 0;font-size:14px;color:var(--muted)}.from-lens blockquote{margin:8px 0;padding:8px 12px;border-left:4px solid var(--brand);font-size:14px;white-space:pre-wrap}
  .lens-back{background:transparent;border:0;color:#BDA0F5;font-weight:800;padding:8px 0;margin-bottom:4px}
  .lens-hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){.lens-astronaut,.lens-dots i{animation:none}}
  .welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
  .welcome h1{font-family:var(--serif);font-size:38px;line-height:1.08;letter-spacing:-.02em;margin:22px 0 10px}
  .point{display:flex;gap:14px;margin-top:16px}
  .point b{display:block}
  .point span{color:var(--muted);font-size:15px}
  .dot{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .msg{font-size:14px;color:var(--muted);margin-top:8px}
  @media (prefers-reduced-motion:reduce){.flash{animation:none}*{transition:none!important}}
  /* ---------- Motion Studio ---------- */
  body.studio{--bg:#000;--surface:#0B0B0E;--ink:#F2F4F5;--muted:#9AA3A8;--line:#262B30;--brand:#3DF5C6;--brand-ink:#001A14;--dark:#000;--warn:#FF8A8A}
  body.studio #app{max-width:520px}
  .st-kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--brand);font-weight:800;margin-top:8px}
  .st-title{font-size:30px;font-weight:850;line-height:1.08;letter-spacing:-.02em;margin:6px 0 12px}
  .st-canvas{display:block;width:100%;height:min(46vh,460px);min-height:280px;margin-top:12px;border-radius:22px;background:#000;border:1px solid #252A2F;touch-action:none;-webkit-user-select:none;user-select:none}
  .st-tools{display:flex;gap:8px;margin-top:10px}
  .st-tool{flex:1;min-height:48px;border:1.5px solid var(--line);background:transparent;border-radius:14px;font-weight:700;font-size:14px;color:var(--ink);padding:0 6px}
  .st-tool[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .st-play{display:flex;gap:12px;align-items:center;margin-top:10px}
  .st-play .btn{width:128px;flex:none}
  .st-time{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .st-time input{width:100%;accent-color:var(--brand)}
  .st-time span{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .st-chips{display:flex;flex-wrap:wrap;gap:8px}
  .st-swatches{display:flex;gap:10px;margin-top:12px}
  .st-sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
  .st-sw[aria-pressed="true"]{border-color:#fff}
  .st-slider{display:flex;align-items:center;gap:12px;margin-top:12px}
  .st-slider label{width:86px;font-size:14px;color:var(--muted);font-weight:700}
  .st-slider input{flex:1;accent-color:var(--brand)}
  .st-slider span{width:44px;text-align:right;font-size:13px;color:var(--muted);font-family:var(--mono)}
  .st-video{width:100%;border-radius:16px;background:#000;margin-top:12px;border:1px solid var(--line)}
  nav button{font-size:11px}
  /* ---------- Launch splash: icon loads, a flash runs along the symbol ---------- */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(90% 70% at 50% 42%,#0F3322 0%,#0A2418 55%,#04110B 100%);animation:spOut .5s ease 2.05s forwards;overflow:hidden}
  @keyframes spOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
  .sp-logo{position:relative;width:132px;height:132px;opacity:0;transform:scale(.84);animation:spIn .6s cubic-bezier(.2,.8,.2,1) .1s forwards}

/* ---------- notes -> cards (rule-based, no AI, no cost) ---------- */
function draftCards(text){
  const out = [], seen = new Set();
  const push = (f, b) => {
    f = f.trim(); b = b.trim();
    if (f.length < 3 || b.length < 2) return;
    const k = f.toLowerCase(); if (seen.has(k)) return; seen.add(k);
    out.push({f, b, on:true});
  };
  const lines = text.split(/\n+/).map(l => l.replace(/^[\s\-*•\d.)]+/, "").trim()).filter(Boolean);
  for (const line of lines){
    let m;
    if ((m = line.match(/^q[:.]\s*(.+?)\s+a[:.]\s*(.+)$/i))){ push(m[1], m[2]); continue; }
    if ((m = line.match(/^(.{4,140}?\?)\s+(.{2,})$/))){ push(m[1], m[2]); continue; }
    if ((m = line.match(/^([^:]{2,60}):\s+(.{3,})$/)) && m[1].trim().split(/\s+/).length <= 6){ push("Define: " + m[1], m[2]); continue; }
    if ((m = line.match(/^(.{2,60}?)\s+[-–—]\s+(.{3,})$/)) && m[1].trim().split(/\s+/).length <= 6){ push("Define: " + m[1], m[2]); continue; }
    const sentences = line.match(/[^.!?]+[.!?]?/g) || [];
    for (let s of sentences){
      s = s.trim(); if (s.length < 20 || s.length > 220) continue;
      if ((m = s.match(/\*\*(.+?)\*\*/))){ push(s.replace(m[0], "_____").replace(/\*\*/g, ""), m[1]); continue; }
      if ((m = s.match(/^(?:the |a |an )?(.{2,40}?)\s+(is|are|means|refers to)\s+(.{8,})$/i))) push("_____ " + m[2] + " " + m[3], m[1]);
    }
  }
  return out.slice(0, 60);
}

function grade(card, g){
  let {interval, ease, reps} = card; const now = Date.now();
  if (g === 0) return {...card, reps:0, interval:0, ease:Math.max(1.3, ease-.2), due:now + 10*60000, last:now};
  if (g === 1){ interval = Math.max(1, Math.round(interval*1.2)); ease = Math.max(1.3, ease-.15); }
  else if (g === 2){ interval = reps === 0 ? 1 : reps === 1 ? 3 : Math.round(interval*ease); }
  else { interval = reps === 0 ? 3 : Math.round(Math.max(interval,1)*ease*1.3) + 1; ease += .1; }
  return {...card, reps:reps+1, interval, ease, due:now + interval*DAY, last:now};
}

function readiness(){
  if (!S.exam || !S.cards.length) return 0;

  for (const c of S.cards){
    if (c.last == null) continue;
    const I = Math.max(c.interval, .5), t = Math.max(0, (ex - c.last) / DAY);
    sum += Math.pow(.9, t / I);
  }
  return Math.round(sum / S.cards.length * 100);
}

  return S.day;
}

function copyQuestion(q){
  const text = String(q || "").trim();
  if (!text) return Promise.reject(new Error("There is no question to send."));
  if (navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      ok ? resolve() : reject(new Error("Copy was blocked by the browser."));
    }catch(e){ reject(e); }
  });
}
async function openAIApp(id){

/* ---------- local on-device vision AI (no API, no account, no per-question quota) ---------- */
let lensVisionProcessor = null;
let lensVisionModel = null;
let lensVisionLoading = null;
let lensVisionRawImage = null;
let lensVisionLastProgressAt = 0;
const LENS_VISION_MODEL = "HuggingFaceTB/SmolVLM-256M-Instruct";
const LENS_TFJS = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";
const LENS_FLAG = "recall:lens:inflight", LENS_SAFE = "recall:lens:safe";

/* A tab that runs out of memory shows Chrome's "Aw, Snap!" page and cannot be caught in code.
   So we leave a marker while the model works. If the marker is still there on the next launch,
   the last run crashed and Recall switches itself to a lighter Safe mode. */
const lensIsSafe = () => { try{ return localStorage.getItem(LENS_SAFE) === "1"; }catch(_){ return false; } };
const lensMark = on => { try{ on ? localStorage.setItem(LENS_FLAG, String(Date.now())) : localStorage.removeItem(LENS_FLAG); }catch(_){} };
try{
  if (localStorage.getItem(LENS_FLAG)){
    localStorage.setItem(LENS_SAFE, "1"); localStorage.removeItem(LENS_FLAG);
    ui.lensNotice = "The last on-device run ran out of memory, so Recall switched to Safe mode: smaller image, shorter answers, CPU only.";
  }
}catch(_){}
window.addEventListener("pagehide", () => lensMark(false));

function lensCfg(){
  const safe = lensIsSafe();
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.deviceMemory && navigator.deviceMemory <= 6);
  return {
    safe, mobile,
    maxSide: safe ? 640 : 1024,
    maxTokens: safe ? 100 : (mobile ? 160 : 220),
    useGPU: !safe && !mobile            // phone GPUs often crash the tab; CPU (WASM) is slower but stable
  };
}

// Shrinks the photo BEFORE the model sees it. Full-resolution phone photos are what exhaust memory.
async function lensPrepareImage(){
  const {load_image} = await import(LENS_TFJS);
  const {maxSide} = lensCfg();
  let src = ui.lensFile;
  try{
    const bmp = await createImageBitmap(ui.lensFile, {resizeWidth:maxSide, resizeQuality:"medium"});
    const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    src = await new Promise(r => c.toBlob(b => r(b || ui.lensFile), "image/jpeg", .9));
  }catch(_){ src = ui.lensFile; }
  return load_image(src);
}

async function loadLensLocalAI(){
  if(lensVisionProcessor && lensVisionModel) return {processor:lensVisionProcessor,model:lensVisionModel};
  if(lensVisionLoading) return lensVisionLoading;

  ui.lensAILoading=true;
  ui.lensAIError="";
  ui.lensAIProgress="Loading the on-device vision model for the first time…";
  ui.lensAIProgressPct=0;
  render();

  lensVisionLoading=(async()=>{
    try{
      const cfg=lensCfg();
      lensMark(true);
      const mod=await import(LENS_TFJS);
      const {AutoProcessor,AutoModelForVision2Seq,load_image,env}=mod;

      env.allowRemoteModels=true;
      env.allowLocalModels=false;
      env.useBrowserCache=true;
      env.useWasmCache=true;
      env.cacheKey="recall-lens-local-ai-v2";
      env.logLevel=env.ERROR ?? 40;

      const progress=e=>{
        if(!ui.lensAILoading) return;
        const now=Date.now();
        if(now-lensVisionLastProgressAt<300 && e.status!=="ready") return;
        lensVisionLastProgressAt=now;
        const pct=Number.isFinite(e.progress)
          ? Math.max(0,Math.min(100,Math.round(e.progress)))
          : ui.lensAIProgressPct;
        ui.lensAIProgressPct=pct;

        if(e.status==="progress_total") ui.lensAIProgress=`Downloading model: ${pct}%`;
        else if(e.status==="done") ui.lensAIProgress="Preparing the vision model…";
        else if(e.file) ui.lensAIProgress=`Preparing ${String(e.file).split("/").pop()}${pct ? ` · ${pct}%` : ""}`;
        render();
      };

      // SmolVLM is loaded through the direct multimodal model API.
      // The pipeline name "image-text-to-text" is not available in the
      // Transformers.js browser package used here.
      let device="wasm";
      let dtype="q4";
      if(cfg.useGPU && navigator.gpu){
        try{
          const adapter=await navigator.gpu.requestAdapter();
          if(adapter){
            device="webgpu";
            dtype=(adapter.features && adapter.features.has("shader-f16")) ? "q4f16" : "q4";
          }
        }catch(_){}
      }

      try{
        lensVisionProcessor=await AutoProcessor.from_pretrained(LENS_VISION_MODEL,{progress_callback:progress});
        lensVisionModel=await AutoModelForVision2Seq.from_pretrained(LENS_VISION_MODEL,{
          device,
          dtype,
          progress_callback:progress
        });
      }catch(firstErr){
        if(device==="webgpu"){
          ui.lensAIProgress="WebGPU model load failed. Trying CPU mode…";
          ui.lensAIProgressPct=0;
          render();
          lensVisionProcessor=await AutoProcessor.from_pretrained(LENS_VISION_MODEL,{progress_callback:progress});
          lensVisionModel=await AutoModelForVision2Seq.from_pretrained(LENS_VISION_MODEL,{
            device:"wasm",
            dtype:"q4",
            progress_callback:progress
          });
        }else{
          throw firstErr;
        }
      }

      lensVisionRawImage=await lensPrepareImage();
      ui.lensAIReady=true;
      ui.lensAILoading=false;
      ui.lensAIProgress="On-device AI is ready. Your questions now run locally on this device.";
      ui.lensAIProgressPct=100;
      render();
      return {processor:lensVisionProcessor,model:lensVisionModel};
    }catch(err){
      lensVisionProcessor=null;
      lensVisionModel=null;
      ui.lensAILoading=false;
      const raw=String(err?.message||"");
      ui.lensAIError=/dynamically imported module|no available backend|blob:/i.test(raw)
        ? "The on-device AI engine was blocked from starting. Reload the page once and try again. If it still fails, open the app in Chrome over http://localhost or https. Details: "+raw.slice(0,160)
        : (raw||"The on-device vision model could not be loaded on this device.");
      ui.lensAIProgress="";
      ui.lensAIProgressPct=0;
      render();
      throw err;
    }finally{
      lensVisionLoading=null;
      lensMark(false);
    }
  })();

  return lensVisionLoading;
}

async function lensAskLocal(){
  const q=String(ui.lensAIQuestion||"").trim();
  if(!q || !ui.lensFile) return;
  if(ui.lensAILoading) return;

  ui.lensAIError="";
  ui.lensAIHistory.push({role:"user",text:q});
  ui.lensAIQuestion="";
  ui.lensAILoading=true;
  ui.lensAIProgress="Thinking on this device…";
  render();

  try{
    const {processor,model}=await loadLensLocalAI();
    ui.lensAILoading=true; // keep the guard on during generation so a second tap can't start a parallel run

    if(!lensVisionRawImage) lensVisionRawImage=await lensPrepareImage();
    const cfg=lensCfg();

    const prior=ui.lensAIHistory
      .slice(0,-1)
      .slice(-6)
      .map(x=>`${x.role==="user"?"User":"Recall AI"}: ${x.text}`)
      .join("\n");

    const prompt=`You are Recall Lens, a private on-device visual study and problem-solving assistant. Analyze the supplied image carefully. Answer the user's question directly and simply. If the image contains a study problem, explain or solve it step by step. If text is visible, transcribe only the relevant parts before reasoning. Do not claim certainty when the image is unclear.
${prior ? "Previous conversation:\n"+prior+"\n\n" : ""}Current user question: ${q}`;

    const messages=[{
      role:"user",
      content:[
        {type:"image"},
        {type:"text",text:prompt}
      ]
    }];

    lensMark(true);
    await new Promise(r=>setTimeout(r,60)); // let the "Thinking…" state paint before the heavy work starts
    const text=processor.apply_chat_template(messages,{add_generation_prompt:true});
    // do_image_splitting:false = one 512px view of the image instead of up to ~17 tiles (the cause of the crash)
    const inputs=await processor(text,[lensVisionRawImage],{do_image_splitting:false});

    const outputIds=await model.generate({
      ...inputs,
      max_new_tokens:cfg.maxTokens,
      do_sample:false,
      repetition_penalty:1.05
    });

    const decode=ids=>String(processor.batch_decode(ids,{skip_special_tokens:true})?.[0]||"").trim();
    let answer="";
    try{
      const promptLen=inputs.input_ids?.dims?.at?.(-1);
      if(promptLen) answer=decode(outputIds.slice(null,[promptLen,null]));
    }catch(_){ answer=""; }

    // Fallback: if slicing was not possible, decode everything and keep the assistant part.
    if(!answer){
      answer=decode(outputIds);
      const assistantMarkers=["Assistant:","assistant\n","<|assistant|>"];
      for(const marker of assistantMarkers){
        const idx=answer.lastIndexOf(marker);
        if(idx>=0){
          const candidate=answer.slice(idx+marker.length).trim();
          if(candidate){ answer=candidate; break; }
        }
      }
    }

    answer=answer || "I couldn't produce an answer from this image.";
    ui.lensAIHistory.push({role:"assistant",text:answer});
  }catch(err){
    ui.lensAIError=err?.message||"The local AI could not analyze this image.";
    if(ui.lensAIHistory.at(-1)?.role==="user") ui.lensAIHistory.pop();
  }finally{
    lensMark(false);
    ui.lensAILoading=false;
    ui.lensAIProgress="";
    render();
  }
}

const LENS_NO_ANSWER = "I couldn't produce an answer from this image.";
const lensCanCheck = t => { t = String(t||"").trim(); return t.length >= 20 && t !== LENS_NO_ANSWER; };
// Turns the AI's reply into a short search question (its first real sentence, ~140 chars).
function lensQueryFromAnswer(t){
  const clean = String(t||"").replace(/[*_`#>]+/g," ").replace(/\b(step|answer)\s*\d*\s*[:.)-]\s*/gi,"").replace(/\s+/g," ").trim();
  const sentences = clean.match(/[^.!?\n]+[.!?]?/g) || [clean];
  let q = (sentences.find(x => x.trim().length >= 25) || sentences[0] || clean).trim();
  if (q.length > 140){ q = q.slice(0,140); const i = q.lastIndexOf(" "); if (i > 60) q = q.slice(0,i); }
  return q.replace(/[.!?]+$/,"").trim();
}
function lensCheckInSources(i){
  const m = ui.lensAIHistory[i]; if (!m || m.role === "user" || !lensCanCheck(m.text)) return;
  const q = lensQueryFromAnswer(m.text); if (!q) return;
  ui.fromLens = true; ui.lensCheckText = m.text; ui.tab = "src"; ui.reviewing = false; ui.msg = "";
  find(q);
}

  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, d = stData(), is3 = ST.mode === "3d";
  stx.W = r.width; stx.H = r.height;
  const tool = (ST.tool === "orbit" && !is3) ? "dots" : ST.tool;
  if (tool === "orbit"){ stx.drag = {type:"orbit", id:e.pointerId, x:px, y:py, yaw:ST.cam.yaw, pitch:ST.cam.pitch}; return; }
  if (tool === "draw"){
    const w = stWorld(px, py); if (!w) return;
    stx.playing = false; stx.rec = [{x:w.x, y:w.y, z:w.z || 0, t:0}]; stx.recT0 = performance.now();
    stx.drag = {type:"draw", id:e.pointerId, last:w, ls:performance.now()}; return;
  }
  if (d.kind === "dots"){
    for (let i = d.dots.length - 1; i >= 0; i--){ const s = stScreen(d.dots[i]); if (Math.hypot(s.x - px, s.y - py) < 26){ stx.drag = {type:"dot", id:e.pointerId, i}; return; } }
  }
  const w = stWorld(px, py); if (!w || d.dots.length >= 40) return;
  d.kind = "dots"; d.drawn = []; d.dots.push({x:w.x, y:w.y, z:w.z || 0});
  stx.drag = {type:"dot", id:e.pointerId, i:d.dots.length - 1}; stx.t = 0; stTouch();
});
document.addEventListener("pointermove", e => {
  const dr = stx.drag; if (!dr || e.pointerId !== dr.id) return;
  const cv = document.getElementById("studioCanvas"); if (!cv) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (dr.type === "orbit"){ ST.cam.yaw = dr.yaw + (px - dr.x)*.01; ST.cam.pitch = Math.max(.2, Math.min(1.3, dr.pitch + (py - dr.y)*.005)); return; }
  if (dr.type === "draw"){ const w = stWorld(px, py); if (w) dr.last = w; return; }
  if (dr.type === "dot"){
    const dot = stData().dots[dr.i]; if (!dot) return;
    const w = stWorld(px, py, ST.mode === "3d" ? dot.y : null);
    if (w){ dot.x = w.x; dot.y = w.y; dot.z = w.z || 0; stx.v++; }
  }
});
function stFinishDraw(dr){
  const rec = stx.rec || []; stx.rec = null; if (!rec.length) return;
  rec.push({x:dr.last.x, y:dr.last.y, z:dr.last.z || 0, t:performance.now() - stx.recT0});
  const is3 = ST.mode === "3d", W = stx.W, H = stx.H;
  const dist = (a, b) => is3 ? Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z)*200 : Math.hypot((a.x - b.x)*W, (a.y - b.y)*H);
  let out = [], lk = null, len = 0;
  for (const s of rec){ if (!lk || dist(s, lk) >= 1.5 || s.t - lk.t >= 80){ if (lk) len += dist(s, lk); out.push(s); lk = s; } }
  if (out[out.length - 1] !== rec[rec.length - 1]) out.push(rec[rec.length - 1]);
  if (out.length < 3 || len < 12 || out[out.length - 1].t < 200) return;
  if (out.length > 900){ const step = Math.ceil(out.length / 900), last = out[out.length - 1]; out = out.filter((_, i) => i % step === 0); if (out[out.length - 1] !== last) out.push(last); }
  const d = stData(); d.kind = "draw";
  d.drawn = out.map(s => ({x:+s.x.toFixed(4), y:+s.y.toFixed(4), z:+(s.z || 0).toFixed(4), t:Math.round(s.t)}));
  stx.t = 0; stx.playing = true; stTouch();
}
function stPointerEnd(e){
  const dr = stx.drag; if (!dr || e.pointerId !== dr.id) return;
  stx.drag = null;
  if (dr.type === "draw") stFinishDraw(dr); else stSave();
}

document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "studioSpeed"){ ST.speed = +e.target.value; const l = document.getElementById("studioSpeedLbl"); if (l) l.textContent = ST.speed.toFixed(2).replace(/0$/, "") + "×"; stSave(); }
  else if (id === "studioScrub"){ const tr = stEnsureTrack(); if (tr){ stx.t = (+e.target.value / 1000) * tr.dur; stx.playing = false; } }
  else if (id === "studioHeight"){ ST.cam.h = +e.target.value / 100; stSave(); }
  else if (id === "studioCap"){ ST.caption = e.target.value.slice(0, 60); stSave(); }
});

/* ---- export: record the canvas as a video (free, on this device) ---- */
function stSetMsg(t){ stx.exportMsg = t; const el = document.getElementById("studioExportMsg"); if (el) el.textContent = t; }
function stExport(){
  if (typeof MediaRecorder === "undefined" || !HTMLCanvasElement.prototype.captureStream){ stSetMsg("This browser can't record video. Use your phone's screen recorder instead."); return; }
  const tr = stEnsureTrack(); if (!tr){ stSetMsg("Add at least two dots (or draw a path) first."); return; }
  const cv = document.getElementById("studioCanvas"); if (!cv) return;
  let rec;
  try{
    const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
    const mime = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(cv.captureStream(30), mime ? {mimeType:mime, videoBitsPerSecond:4000000} : {});
  }catch(err){ stSetMsg("Video recording isn't available here."); return; }
  const chunks = [];
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  rec.onstop = () => {
    const type = rec.mimeType || "video/webm", blob = new Blob(chunks, {type});
    if (stx.exportUrl) URL.revokeObjectURL(stx.exportUrl);
    stx.exportBlob = blob; stx.exportUrl = URL.createObjectURL(blob); stx.exportExt = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
    stx.exporting = false; stx.finishing = false; stx.recorder = null; stx.exportMsg = "Video ready. Save or share it below."; render();
  };
  stx.recorder = rec; stx.finishing = false; stx.exporting = true; stx.t = 0; stx.playing = true;
  stSetMsg("Recording one full loop…");
  rec.start();
}
async function stShare(){
  if (!stx.exportBlob) return;
  const file = new File([stx.exportBlob], "recall-motion." + stx.exportExt, {type:stx.exportBlob.type});
  try{
    if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Made with Recall"});
    else stSetMsg("Sharing isn't supported here. Use Save video instead.");
  }catch(err){ if (err && err.name !== "AbortError") stSetMsg("Couldn't open the share sheet. Use Save video instead."); }
}

      <div style="margin-top:8px">The Source Finder opens each website's own search in your browser. Recall never sees what you read there.</div></div>
    <h2 class="sec">How Recall works</h2>
    <div class="card muted" style="font-size:15px">You forget new information fast, and each well-timed review slows the forgetting. Recall schedules every card right before you'd forget it, and rolls that up into your readiness for exam day.</div>
    <h2 class="sec">Backup and move devices</h2>
    <div class="card"><textarea class="f box" id="bk" rows="3" placeholder="Backup text appears here" style="font-size:13px">${esc(ui.bk)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn small ghost" style="flex:1" data-act="export">Export</button><button class="btn small ghost" style="flex:1" data-act="import">Import</button></div>
      ${ui.msg ? `<div class="msg">${esc(ui.msg)}</div>` : ""}</div>
    <button class="btn danger" style="margin-top:22px" data-act="reset">Erase all data on this phone</button>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:16px">Recall v1.0 · free forever</p>`;
}

/* ---------- render ---------- */
function renderInner(){
  const app = document.getElementById("app");
  if (!S.onboarded){ document.body.classList.remove("src"); app.innerHTML = viewWelcome(); return; }
  document.body.classList.toggle("src", ui.tab === "src");
  document.body.classList.toggle("lens", ui.tab === "lens");
  document.body.classList.toggle("studio", ui.tab === "studio");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", ui.tab === "lens" ? "#050507" : ui.tab === "studio" ? "#000000" : ui.tab === "src" ? "#0C1330" : "#0A2418");
  const tags = {today:"Exam-ready, on schedule", lib:"Build your deck", src:"Verify what you study", lens:"See it. Understand it. Act.", studio:"Animate anything with dots", you:"Your progress and privacy"};
  const body = ui.tab === "today" ? (ui.reviewing ? viewReview() : viewToday()) : ui.tab === "lib" ? viewLibrary() : ui.tab === "src" ? viewSources() : ui.tab === "lens" ? viewLens() : ui.tab === "studio" ? viewStudio() : viewYou();
  const tabs = [["today","Today"],["lib","Library"],["src","Sources"],["lens","Lens"],["studio","Studio"],["you","You"]];
  app.innerHTML = `<header><div class="brand">${MARK}<div><div class="logo">Recall</div><div class="tag">${tags[ui.tab]}</div></div></div>
    <div class="streak" aria-label="Study streak">${I.flame}${streakNow()}</div></header>
    <main>${body}</main>
    <nav aria-label="Main"><div class="in">${tabs.map(([id, t]) => `<button data-act="tab" data-id="${id}" ${ui.tab === id ? 'aria-current="page"' : ""}>${I[id]}${t}</button>`).join("")}</div></nav>`;
  if (ui.tab === "studio") stEnter();
}

function render(){
  try{ renderInner(); }
  catch(err){ console.error(err); if (window.__recallPanel) window.__recallPanel(String((err && err.stack) || err).slice(0, 400)); }
}

/* ---------- actions ---------- */
function find(q){
  q = q.trim(); if (!q) return;
  ui.q = q; ui.topic = detect(q); ui.searched = true; ui.lastSrc = "";
  S.history = [q, ...S.history.filter(h => h !== q)].slice(0, 8); save(); render();
}
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id && Object.prototype.hasOwnProperty.call(ui, id) && typeof ui[id] === "string") ui[id] = e.target.value;
});
document.addEventListener("change", e => { if (e.target.id === "lensFile" && e.target.files && e.target.files[0]) lensUseFile(e.target.files[0]); });
document.addEventListener("keydown", e => {
  if (e.target.id === "q" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); find(e.target.value); }
  if (e.target.id === "lensAIQuestion" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); lensAskLocal(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "opened"){ ui.lastSrc = b.dataset.name; return; }
  if (a === "welcome"){ S.onboarded = true; save(); }
  else if (a === "tab"){ if (ui.tab === "lens" && b.dataset.id !== "lens") stopLensCamera(); if (b.dataset.id !== "src") ui.fromLens = false; ui.tab = b.dataset.id; ui.reviewing = false; ui.msg = ""; if (ui.tab === "lens" && ui.lensStage === "home") return lensStart(); }
  else if (a === "lensstart"){ return lensStart(); }
  else if (a === "lenscamera"){ return lensOpenCamera(); }
  else if (a === "lenscapture"){ return lensCapture(); }
  else if (a === "lenspick"){ const f=document.getElementById("lensFile"); if(f) f.click(); return; }
  else if (a === "lensback"){ lensReset(); }
  else if (a === "lenschatback"){ ui.lensStage="result"; ui.lensAIError=""; render(); }
  else if (a === "lenslocal"){ return lensLocalChatOpen(); }
  else if (a === "lensstarter"){ ui.lensAIQuestion=b.dataset.q||""; return lensAskLocal(); }
  else if (a === "lensask"){ return lensAskLocal(); }
  else if (a === "lenschatreset"){ return lensLocalResetChat(); }
  else if (a === "lensfast"){ try{ localStorage.removeItem(LENS_SAFE); }catch(_){} ui.lensNotice=""; }
  else if (a === "lenscheck"){ return lensCheckInSources(+b.dataset.i); }
  else if (a === "lensfromsrc"){ ui.fromLens = false; ui.tab = "lens"; }
  else if (a === "stmode"){ ST.mode = b.dataset.m; if (ST.mode === "2d" && ST.tool === "orbit") ST.tool = "dots"; stx.t = 0; stx.playing = false; stTouch(); }
  else if (a === "sttool"){ ST.tool = b.dataset.t; stSave(); }
  else if (a === "stundo"){ const d = stData(); if (d.kind === "draw"){ d.kind = "dots"; d.drawn = []; } else d.dots.pop(); stx.t = 0; stTouch(); }
  else if (a === "stclear"){ const d = stData(); d.kind = "dots"; d.dots = []; d.drawn = []; ST.closed = false; stx.t = 0; stx.playing = false; stTouch(); }
  else if (a === "stplay"){ const tr = stEnsureTrack(); if (!tr) return; if (!stx.playing && stx.t >= tr.dur - .01) stx.t = 0; stx.playing = !stx.playing; return; }
  else if (a === "stactor"){ if (ST.mode === "3d") ST.actor3 = b.dataset.a; else ST.actor2 = b.dataset.a; stSave(); }
  else if (a === "stcolor"){ ST.color = b.dataset.c; stSave(); }
  else if (a === "sttoggle"){ const k = b.dataset.k; ST[k] = !ST[k]; if (k === "closed" || k === "smooth") stTouch(); else stSave(); }
  else if (a === "sttpl"){ stApplyTemplate(+b.dataset.i); }
  else if (a === "stexport"){ return stExport(); }
  else if (a === "stshare"){ return stShare(); }
  else if (a === "lensretry"){ ui.lensAIError=""; loadLensLocalAI().catch(()=>{}); return; }
  else if (a === "lensshare"){ return lensShare(); }
  else if (a === "lenssave"){ return lensSaveVisual(); }
  else if (a === "lensdownload"){ return lensDownload(); }
  else if (a === "start"){ ui.reviewing = true; ui.shown = false; ui.sessionTotal = queue().all.length; }
  else if (a === "end"){ ui.reviewing = false; }
  else if (a === "show"){ ui.shown = true; }
  else if (a === "grade"){
    const c = queue().all[0]; if (!c) return;
    const wasNew = c.last == null, today = todayKey();
    S.cards = S.cards.map(x => x.id === c.id ? grade(x, +b.dataset.g) : x);
    if (wasNew) dayState().done++;
    S.log[today] = (S.log[today] || 0) + 1;
    if (S.lastStudy !== today){ S.streak = S.lastStudy === ymd(Date.now() - DAY) ? S.streak + 1 : 1; S.lastStudy = today; }
    ui.shown = false; save();
  }
  else if (a === "setexam"){
    if (!ui.exname.trim() || !ui.exdate){ ui.msg = "Add an exam name and date."; }
    else if (new Date(ui.exdate + "T23:59:00").getTime() < Date.now()){ ui.msg = "Pick a date in the future."; }
    else { S.exam = {name:ui.exname.trim(), date:ui.exdate}; S.day = null; ui.exname = ""; ui.exdate = ""; ui.msg = ""; save(); }
  }
  else if (a === "clearexam"){ S.exam = null; S.day = null; save(); }
  else if (a === "mode"){ ui.mode = b.dataset.m; ui.msg = ""; }
  else if (a === "add"){
    if (!ui.front.trim() || !ui.back.trim()){ ui.msg = "Add both a question and an answer."; }
    else { S.cards.push(newCard(ui.front.trim(), ui.back.trim(), ui.srcn.trim())); ui.front = ""; ui.back = ""; ui.srcn = ""; ui.msg = "Card added."; save(); }
  }
  else if (a === "del"){ S.cards = S.cards.filter(c => c.id !== b.dataset.id); save(); }
  else if (a === "draft"){
    ui.drafts = draftCards(ui.notes);
    ui.msg = ui.drafts.length ? "" : "No cards found. Try lines like “Term: definition” or “Question? Answer”.";
  }
  else if (a === "toggledraft"){ const d = ui.drafts[+b.dataset.i]; if (d) d.on = !d.on; }
  else if (a === "adddrafts"){
    const picked = ui.drafts.filter(d => d.on);
    picked.forEach(d => S.cards.push(newCard(d.f, d.b)));
    ui.msg = "Added " + picked.length + " card" + (picked.length === 1 ? "" : "s") + "."; ui.drafts = []; ui.notes = ""; save();
  }
  else if (a === "export"){ ui.bk = JSON.stringify(S); ui.msg = "Exported. Copy this text and keep it somewhere safe."; }
  else if (a === "import"){
    try{ const p = JSON.parse(ui.bk); if (!Array.isArray(p.cards)) throw 0;
      S = Object.assign({exam:null, log:{}, day:null, history:[], onboarded:true, streak:0, lastStudy:null}, p); save(); ui.msg = "Backup restored."; }
    catch(err){ ui.msg = "That isn't a valid backup. Paste the full exported text."; }
  }
  else if (a === "reset"){
    if (confirm("Erase all cards and progress on this phone? This can't be undone.")){
      try{ localStorage.removeItem(KEY); }catch(err){}
      S = Object.assign({exam:null, log:{}, day:null, history:[], onboarded:false, streak:0, lastStudy:null}, {cards:STARTER.map(([f, g]) => newCard(f, g))});
      ui.tab = "today"; ui.msg = "";
    } else return;
  }
  else if (a === "find"){ const t = document.getElementById("q"); return find(t ? t.value : ui.q); }
  else if (a === "openai"){ return openAIApp(b.dataset.ai); }
  else if (a === "topic"){ ui.topic = b.dataset.id; }
  else if (a === "rerun"){ return find(S.history[+b.dataset.i]); }
  else if (a === "tocard"){ ui.front = ui.q; ui.back = ""; ui.srcn = ui.lastSrc; ui.mode = "write"; ui.tab = "lib"; ui.msg = "Write the answer from what you read, then add the card."; }
  render();
});
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
